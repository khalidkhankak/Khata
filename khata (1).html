<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کھاتہ – ادھار کا حساب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#1b2a22;--mut:#6b7a72;--pri:#0f7b4f;--red:#c0392b;--bd:#dde4df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a15;--card:#1a261f;--tx:#e8f0ea;--mut:#93a39a;--pri:#2fbf80;--red:#ff7a6b;--bd:#2c3b32}}
:root[data-theme="dark"]{--bg:#111a15;--card:#1a261f;--tx:#e8f0ea;--mut:#93a39a;--pri:#2fbf80;--red:#ff7a6b;--bd:#2c3b32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;line-height:1.7;font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 100px}
h1{margin:4px 0 12px;font-size:26px;color:var(--pri)}
.tot{background:var(--pri);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.tot small{opacity:.85;display:block}.tot b{font-size:32px}
input{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row span{color:var(--mut);font-size:14px;display:block}
.bal{font-weight:700;direction:ltr}.red{color:var(--red)}.grn{color:var(--pri)}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.dng{background:transparent;color:var(--red)}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);box-shadow:0 4px 14px #0004;padding:13px 26px;font-weight:700}
.acts{display:flex;gap:8px;margin:12px 0}.acts button{flex:1}
.tx{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--bd)}
.tx span{color:var(--mut);font-size:13px;display:block}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.bk{margin-bottom:6px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.on{display:flex}
.box{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.box h3{margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
var KEY='khata_v1',D=[],cur=null,q='';
try{D=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){D=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bal(c){return c.tx.reduce(function(s,t){return s+(t.t=='u'?t.a:-t.a)},0)}
function fmt(n){return 'Rs '+Math.abs(n).toLocaleString('en-US')}
function $(id){return document.getElementById(id)}
function home(){
  cur=null;var total=D.reduce(function(s,c){return s+Math.max(bal(c),0)},0);
  var l=D.filter(function(c){return c.name.indexOf(q)>-1});
  $('app').innerHTML='<h1>📒 کھاتہ</h1><div class="tot"><small>کل بقایا (لوگوں سے لینا ہے)</small><b>'+fmt(total)+'</b></div>'+
  '<input id="s" placeholder="گاہک تلاش کریں…" value="'+esc(q)+'" oninput="q=this.value;list()">'+'<div id="l"></div>'+'<div class="acts" style="margin-top:18px"><button class="sec" onclick="bk()">⬇ بیک اپ لیں</button><button class="sec" onclick="rs()">⬆ بیک اپ بحال کریں</button></div>'+
  '<button class="fab" onclick="addC()">+ نیا گاہک</button>';
  list();
}
function list(){
  var l=D.filter(function(c){return c.name.indexOf(q)>-1}),h='';
  l.forEach(function(c){var b=bal(c);
    h+='<div class="row" onclick="open_('+c.id+')"><div>'+esc(c.name)+'<span>'+esc(c.phone)+'</span></div><div class="bal '+(b>0?'red':'grn')+'">'+fmt(b)+'</div></div>'});
  $('l').innerHTML=h||'<div class="empty">'+(D.length?'کوئی گاہک نہیں ملا':'ابھی کوئی گاہک نہیں۔ نیچے بٹن سے شامل کریں۔')+'</div>';
}
function open_(id){
  cur=D.filter(function(c){return c.id==id})[0];if(!cur)return home();
  var b=bal(cur),h='<button class="sec bk" onclick="home()">← واپس</button><h1>'+esc(cur.name)+'</h1>'+
  '<div class="tot"><small>'+(b>0?'اس سے لینا ہے':'حساب برابر / ایڈوانس')+'</small><b>'+fmt(b)+'</b></div>'+
  '<div class="acts"><button onclick="addT(\'u\')" style="background:var(--red)">ادھار دیا</button><button onclick="addT(\'w\')">وصولی ملی</button></div>';
  if(cur.phone&&b>0){var p=cur.phone.replace(/\D/g,'');
    h+='<a href="https://wa.me/'+p+'?text='+encodeURIComponent('السلام علیکم '+cur.name+'، آپ کا بقایا '+fmt(b)+' ہے۔ مہربانی کر کے ادا کر دیں۔ شکریہ')+'" target="_blank" rel="noopener"><button class="sec" style="width:100%">واٹس ایپ پر یاد دہانی بھیجیں</button></a>'}
  h+='<div style="margin-top:14px">';
  cur.tx.slice().reverse().forEach(function(t){
    h+='<div class="tx"><div>'+(t.t=='u'?'ادھار':'وصولی')+'<span>'+esc(t.n)+' · '+t.d+'</span></div><div class="bal '+(t.t=='u'?'red':'grn')+'">'+(t.t=='u'?'+':'−')+fmt(t.a)+'</div></div>'});
  if(!cur.tx.length)h+='<div class="empty">ابھی کوئی لین دین نہیں</div>';
  h+='</div><div style="text-align:center;margin-top:20px"><button class="dng" onclick="delC()">یہ گاہک حذف کریں</button></div>';
  $('app').innerHTML=h;
}
function modal(h){$('mb').innerHTML=h;$('m').classList.add('on')}
function close_(){$('m').classList.remove('on')}
$('m').onclick=function(e){if(e.target==this)close_()};
function addC(){modal('<h3>نیا گاہک</h3><input id="n" placeholder="نام"><input id="p" type="tel" placeholder="فون (مثلاً 923001234567)" dir="ltr"><button style="width:100%" onclick="saveC()">محفوظ کریں</button>');}
function saveC(){var n=$('n').value.trim();if(!n)return;
  D.push({id:Date.now(),name:n,phone:$('p').value.trim(),tx:[]});save();close_();home()}
function addT(t){modal('<h3>'+(t=='u'?'ادھار دیا':'وصولی ملی')+'</h3><input id="a" type="number" inputmode="numeric" placeholder="رقم" dir="ltr"><input id="dt" type="date" dir="ltr" value="'+today()+'"><input id="nt" placeholder="تفصیل (اختیاری)"><button style="width:100%" onclick="saveT(\''+t+'\')">محفوظ کریں</button>');}
function today(){var n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2)}
function fd(v){if(!v)return new Date().toLocaleDateString('en-GB');var p=v.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function saveT(t){var a=parseFloat($('a').value);if(!(a>0))return;
  cur.tx.push({t:t,a:a,n:$('nt').value.trim(),d:fd($('dt').value)});save();close_();open_(cur.id)}
function bk(){modal('<h3>بیک اپ</h3><p style="margin:0 0 8px;color:var(--mut);font-size:14px">نیچے کا پورا متن کاپی کر کے واٹس ایپ (اپنے نمبر پر) یا نوٹس میں محفوظ کر لیں۔</p><textarea id="bt" readonly dir="ltr" style="width:100%;height:130px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:8px;margin-bottom:10px;font-size:12px"></textarea><button style="width:100%" onclick="cp()">کاپی کریں</button>');$('bt').value=JSON.stringify(D)}
function cp(){var t=$('bt');t.select();try{navigator.clipboard.writeText(t.value).then(function(){alert('کاپی ہو گیا ✅')},function(){document.execCommand('copy');alert('کاپی ہو گیا ✅')})}catch(e){try{document.execCommand('copy');alert('کاپی ہو گیا ✅')}catch(x){alert('متن کو دبا کر رکھیں اور کاپی چنیں')}}}
function rs(){modal('<h3>بیک اپ بحال کریں</h3><p style="margin:0 0 8px;color:var(--red);font-size:14px">خبردار: اس سے موجودہ حساب کی جگہ بیک اپ والا حساب آ جائے گا۔</p><textarea id="rt" dir="ltr" placeholder="یہاں بیک اپ کا متن پیسٹ کریں" style="width:100%;height:130px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);padding:8px;margin-bottom:10px;font-size:12px"></textarea><button style="width:100%" onclick="doRs()">بحال کریں</button>')}
function doRs(){try{var a=JSON.parse($('rt').value.trim());if(!Array.isArray(a)||a.some(function(c){return !c||typeof c.name!='string'||!Array.isArray(c.tx)}))throw 0;D=a;save();close_();home();alert('حساب بحال ہو گیا ✅')}catch(e){alert('بیک اپ کا متن درست نہیں۔ دوبارہ پیسٹ کریں۔')}}
function delC(){if(confirm('کیا واقعی حذف کریں؟')){D=D.filter(function(c){return c.id!=cur.id});save();home()}}
home();
</script>
</body>
</html>
